name: PR Quality Check

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-check:
    name: Code Quality & Extension Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout PR code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: TypeScript type checking
      run: npx tsc --noEmit
      
    - name: ESLint code quality
      run: npm run lint

    - name: Run unit tests
      run: npm test
      
    - name: Build extension
      run: npm run compile
      
    - name: Validate extension package
      run: |
        npm install -g @vscode/vsce
        vsce package
        
    - name: Check package.json validity
      run: |
        node -e "
          const pkg = require('./package.json');
          if (!pkg.publisher) throw new Error('Missing publisher in package.json');
          if (!pkg.version) throw new Error('Missing version in package.json');
          if (!pkg.engines?.vscode) throw new Error('Missing vscode engine requirement');
          console.log('✅ Package.json validation passed');
        "
        
    - name: Validate MCP configuration
      run: |
        if [ ! -f ".mcp.json" ]; then
          echo "❌ Missing .mcp.json configuration"
          exit 1
        fi
        echo "✅ MCP configuration found"
        
    - name: Check for sensitive data
      run: |
        # Fail on secret-shaped tokens only. Code that merely mentions a prefix
        # (validation.ts checks startsWith('ghp_'), the CSS class `risk-score`
        # contains `sk-`) must not match, so each prefix is anchored on a word
        # boundary and must be followed by a realistic token body:
        #   gh[pousr]_  + 36+ [A-Za-z0-9]   GitHub classic PAT / OAuth / app tokens
        #   github_pat_ + 80+ [A-Za-z0-9_]  GitHub fine-grained PAT
        #   sk-         + 20+ [A-Za-z0-9_-] OpenAI / Anthropic style API keys
        PATTERN='\b(gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{80,}|sk-[A-Za-z0-9_-]{20,})'
        STATUS=0
        MATCHES=$(grep -rEn "$PATTERN" src/ --exclude-dir=node_modules) || STATUS=$?
        if [ "$STATUS" -eq 0 ]; then
          echo "❌ Potential secrets detected in source code:"
          echo "$MATCHES"
          echo "Remove the credential from src/ and rotate it if it was ever valid."
          exit 1
        elif [ "$STATUS" -ne 1 ]; then
          echo "❌ Secret scan failed to run (grep exit code $STATUS)"
          exit "$STATUS"
        fi
        echo "✅ No secret-shaped tokens found in src/"
        
    - name: Extension size check
      run: |
        VSIX_SIZE=$(stat -c%s *.vsix)
        MAX_SIZE=$((50 * 1024 * 1024))  # 50MB limit
        if [ $VSIX_SIZE -gt $MAX_SIZE ]; then
          echo "❌ Extension package too large: $(($VSIX_SIZE / 1024 / 1024))MB (max 50MB)"
          exit 1
        fi
        echo "✅ Extension size OK: $(($VSIX_SIZE / 1024 / 1024))MB"
        
    - name: Comment PR with results
      uses: actions/github-script@v7
      if: always()
      continue-on-error: true
      env:
        JOB_STATUS: ${{ job.status }}
      with:
        script: |
          const fs = require('fs');
          const vsixFiles = fs.readdirSync('.').filter(f => f.endsWith('.vsix'));
          const vsixFile = vsixFiles[0] || 'Not generated';
          const passed = process.env.JOB_STATUS === 'success';
          const status = passed ? '✅ Passed' : '❌ Failed';
          
          const body = `## 🔍 Extension Quality Check Results
          
          ### Validation Status
          - **TypeScript Compilation**: ${status}
          - **ESLint Quality Check**: ${status}
          - **Extension Packaging**: ${status}
          - **Configuration Check**: ${status}
          
          ### 📦 Extension Details
          - **Generated VSIX**: \`${vsixFile}\`
          
          ### 🎯 Next Steps
          ${passed
            ? '✨ This PR is ready to merge! The extension builds successfully and passes all quality checks.'
            : '🔧 Please fix the issues above before merging.'}
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
